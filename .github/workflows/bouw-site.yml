name: Site bouwen

# Handmatig starten via GitHub: tabblad Actions > "Site bouwen" > Run workflow (kies de branch).
# Draait build.py en zet de bijgewerkte HTML in site/ terug op dezelfde branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Site bouwen
        run: python3 build.py
      - name: Wijzigingen opslaan
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in site/"
          else
            git commit -m "Site opnieuw gebouwd (GitHub Actions)"
            git push
          fi
